name: Fill in song links

on:
  push:
    branches: [main]
    paths: [tracks.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enrich
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Look up exact links and previews
        run: python scripts/enrich_tracks.py
      - name: Save changes
        run: |
          if git diff --quiet -- tracks.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "top-set-tracks-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracks.json
          git commit -m "Fill in song links and previews"
          git pull --rebase origin main
          git push
